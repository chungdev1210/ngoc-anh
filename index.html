<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please</title>
    <style>
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        p {
            margin: 0 0;
            position: absolute;
            font: 16px Verdana;
            color: #eee;
            height: 25px;
            top: calc(100vh - 30px);
            text-shadow: 0 0 2px white;
        }

        p a {
            text-decoration: none;
            color: #aaa;
        }

        span {
            font-size: 11px;
        }

        p>a:first-of-type {
            font-size: 20px;
        }

        body {
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id=c></canvas>
    <!-- <p>From the codepals to <a href="https://codepen.io/tmrDevelops">Tiffany</a><span>, by <a
                href="https://codepen.io/towc">Matei</a></span></p> -->

    <script>
        var canvas = document.getElementById('c'),
            ctx = canvas.getContext('2d'),
            w,
            h,
            startTime = performance.now(),
            balloonLetters = [],
            balloonCycle = -1,
            opts = {
                strings: [
                    'LE THI NGOC ANH',
                    'Anh có điều này muốn nói với em',
                    'I See The Whole Galaxy',
                    'But I Only Have One Star In My Heart',
                    'Your Own Little World',
                    'CHUNG DEV'
                ],
                charSize: 30,
                lineHeight: 46,
                typeSpeed: 95,
                linePause: 260,
                donePause: 5000,
                balloonDuration: 11000,
                cyclePause: 500,
                balloonBaseSize: 28,
                balloonAddedSize: 28,
                balloonBaseDelay: 35,
                balloonRandomDelay: 360,
                balloonInflateTime: 820,
                background: '#111',
                textColor: '#f7f7f7',
                accentColor: '#ff8fb3'
            };

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;

            opts.charSize = Math.max(16, Math.min(30, w / 16));
            ctx.font = '600 ' + opts.charSize + 'px Verdana';

            while (getLongestLineWidth() > w * 0.9 && opts.charSize > 14) {
                opts.charSize -= 1;
                ctx.font = '600 ' + opts.charSize + 'px Verdana';
            }

            opts.lineHeight = opts.charSize * 1.55;
            ctx.textBaseline = 'middle';
            balloonLetters = [];
            balloonCycle = -1;
        }

        function getLongestLineWidth() {
            var longest = 0;

            for (var i = 0; i < opts.strings.length; i++) {
                longest = Math.max(longest, ctx.measureText(opts.strings[i]).width);
            }

            return longest;
        }

        function getTotalTypingTime() {
            var characterCount = opts.strings.join('').length,
                pauseCount = Math.max(0, opts.strings.length - 1);

            return characterCount * opts.typeSpeed + pauseCount * opts.linePause;
        }

        function getTotalCycleTime() {
            return getTotalTypingTime() + opts.donePause + opts.balloonDuration + opts.cyclePause;
        }

        function getTextStartY() {
            return h / 2 - (opts.strings.length - 1) * opts.lineHeight / 2;
        }

        function getVisibleText(elapsed) {
            var remainingTime = elapsed,
                lines = [],
                cursorLine = 0,
                cursorColumn = 0,
                isDone = false;

            for (var i = 0; i < opts.strings.length; i++) {
                var line = opts.strings[i],
                    lineTypingTime = line.length * opts.typeSpeed;

                if (remainingTime >= lineTypingTime) {
                    lines.push(line);
                    remainingTime -= lineTypingTime;
                    cursorLine = i;
                    cursorColumn = line.length;
                } else {
                    var visibleCount = Math.floor(remainingTime / opts.typeSpeed);
                    lines.push(line.slice(0, visibleCount));
                    cursorLine = i;
                    cursorColumn = visibleCount;
                    break;
                }

                if (i < opts.strings.length - 1) {
                    if (remainingTime >= opts.linePause) {
                        remainingTime -= opts.linePause;
                    } else {
                        cursorLine = i + 1;
                        cursorColumn = 0;
                        lines.push('');
                        break;
                    }
                }
            }

            while (lines.length < opts.strings.length) {
                lines.push('');
            }

            if (elapsed >= getTotalTypingTime()) {
                isDone = true;
                cursorLine = opts.strings.length - 1;
                cursorColumn = opts.strings[opts.strings.length - 1].length;
            }

            return {
                lines: lines,
                cursorLine: cursorLine,
                cursorColumn: cursorColumn,
                isDone: isDone
            };
        }

        function drawTypingText(state, now) {
            var startY = getTextStartY();

            ctx.textAlign = 'left';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
            ctx.shadowBlur = 10;

            for (var i = 0; i < state.lines.length; i++) {
                var fullLine = opts.strings[i],
                    visibleLine = state.lines[i],
                    x = w / 2 - ctx.measureText(fullLine).width / 2,
                    y = startY + i * opts.lineHeight,
                    gradient = ctx.createLinearGradient(x, y, x + Math.max(1, ctx.measureText(fullLine).width), y);

                gradient.addColorStop(0, opts.textColor);
                gradient.addColorStop(1, opts.accentColor);
                ctx.fillStyle = gradient;
                ctx.fillText(visibleLine, x, y);
            }

            if (!state.isDone || Math.floor(now / 450) % 2 === 0) {
                var currentFullLine = opts.strings[state.cursorLine] || '',
                    currentVisibleLine = currentFullLine.slice(0, state.cursorColumn),
                    cursorX = w / 2 - ctx.measureText(currentFullLine).width / 2 + ctx.measureText(currentVisibleLine).width + 4,
                    cursorY = startY + state.cursorLine * opts.lineHeight,
                    cursorHeight = opts.charSize * 1.05;

                ctx.shadowBlur = 0;
                ctx.fillStyle = opts.accentColor;
                ctx.fillRect(cursorX, cursorY - cursorHeight / 2, 3, cursorHeight);
            }

            ctx.shadowBlur = 0;
        }

        function createBalloonLetters() {
            var letters = [],
                startY = getTextStartY(),
                order = 0;

            for (var i = 0; i < opts.strings.length; i++) {
                var line = opts.strings[i],
                    lineX = w / 2 - ctx.measureText(line).width / 2,
                    y = startY + i * opts.lineHeight;

                for (var j = 0; j < line.length; j++) {
                    var char = line[j],
                        charWidth = ctx.measureText(char).width;

                    if (char !== ' ') {
                        var x = lineX + ctx.measureText(line.slice(0, j)).width + charWidth / 2,
                            hue = (order * 24 + i * 35) % 360;

                        letters.push({
                            char: char,
                            x: x,
                            y: y,
                            hue: hue,
                            size: opts.balloonBaseSize + opts.balloonAddedSize * Math.random(),
                            delay: order * opts.balloonBaseDelay + opts.balloonRandomDelay * Math.random(),
                            sway: 10 + 16 * Math.random(),
                            swayOffset: Math.random() * Math.PI * 2,
                            drift: -35 + 70 * Math.random()
                        });
                    }

                    order++;
                }
            }

            return letters;
        }

        function generateBalloonPath(x, y, size) {
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - size / 2, y - size / 2,
                x - size / 4, y - size,
                x, y - size);
            ctx.bezierCurveTo(x + size / 4, y - size,
                x + size / 2, y - size / 2,
                x, y);
        }

        function drawBalloonLetter(letter, elapsed) {
            var age = elapsed - letter.delay,
                textX = letter.x,
                textY = letter.y,
                balloonSize = 0,
                balloonBottomY = letter.y,
                color = 'hsl(' + letter.hue + ', 80%, 56%)',
                lightColor = 'hsl(' + letter.hue + ', 80%, 74%)';

            if (age < 0) {
                drawFloatingChar(letter.char, textX, textY, lightColor);
                return;
            }

            if (age < opts.balloonInflateTime) {
                var inflate = age / opts.balloonInflateTime;

                balloonSize = letter.size * inflate;
                balloonBottomY = letter.y - balloonSize;
            } else {
                var flightTime = Math.max(1, opts.balloonDuration - letter.delay - opts.balloonInflateTime),
                    progress = Math.min(1, (age - opts.balloonInflateTime) / flightTime),
                    eased = 1 - Math.pow(1 - progress, 2),
                    sway = Math.sin(progress * Math.PI * 5 + letter.swayOffset) * letter.sway,
                    lift = eased * (h + opts.charSize * 8);

                textX = letter.x + sway + letter.drift * progress;
                textY = letter.y - lift;
                balloonSize = letter.size;
                balloonBottomY = textY - opts.charSize * 0.8;
            }

            if (textY < -opts.charSize * 3) {
                return;
            }

            ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
            ctx.shadowBlur = 7;
            ctx.fillStyle = color;
            ctx.beginPath();
            generateBalloonPath(textX, balloonBottomY, balloonSize);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = lightColor;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(textX, balloonBottomY);
            ctx.lineTo(textX, textY - opts.charSize * 0.48);
            ctx.stroke();

            drawFloatingChar(letter.char, textX, textY, lightColor);
        }

        function drawFloatingChar(char, x, y, color) {
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.65)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = color;
            ctx.fillText(char, x, y);
            ctx.shadowBlur = 0;
        }

        function drawBalloonText(elapsed) {
            for (var i = 0; i < balloonLetters.length; i++) {
                drawBalloonLetter(balloonLetters[i], elapsed);
            }
        }

        function anim(now) {
            window.requestAnimationFrame(anim);

            var typingTime = getTotalTypingTime(),
                cycleTime = getTotalCycleTime(),
                currentCycle = Math.floor((now - startTime) / cycleTime),
                elapsed = (now - startTime) % cycleTime,
                state = getVisibleText(elapsed);

            ctx.fillStyle = opts.background;
            ctx.fillRect(0, 0, w, h);

            if (elapsed < typingTime + opts.donePause) {
                drawTypingText(state, now);
                return;
            }

            if (elapsed < typingTime + opts.donePause + opts.balloonDuration) {
                if (balloonCycle !== currentCycle || balloonLetters.length === 0) {
                    balloonLetters = createBalloonLetters();
                    balloonCycle = currentCycle;
                }

                drawBalloonText(elapsed - typingTime - opts.donePause);
            }
        }

        resize();
        anim(startTime);
        window.addEventListener('resize', resize);
    </script>

</body>

</html>
